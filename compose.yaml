services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db
    volumes:
      - pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "11007:8080"
    depends_on:
      - db

  core:
    image: linear-like-qwen-core:dev
    build:
      context: .
      dockerfile: core/Dockerfile
      target: dev
      args:
        USER_ID: ${USER_ID}
        USER_GID: ${USER_GID}
    ports:
      - "11009:80"
    env_file:
      - .env
    volumes:
      - ./core:/app/core
    depends_on:
      - db
    restart: unless-stopped

  webapp:
    image: linear-like-qwen-webapp:dev
    build:
      context: .
      dockerfile: webapp/Dockerfile
      target: dev
      args:
        USER_ID: ${USER_ID}
        USER_GID: ${USER_GID}
    ports:
      - "11008:3000"
    volumes:
      - ./webapp:/app/webapp
      - /app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
    depends_on:
      - core
    restart: unless-stopped

volumes:
  pg_data:
